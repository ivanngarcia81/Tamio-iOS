name: Tamio
options:
  bundleIdPrefix: church.tamio
  deploymentTarget:
    # iOS 26: la app usa Liquid Glass (glassEffect, GlassEffectContainer, los
    # estilos de botón .glass), el desvanecido de borde de scroll y las
    # colocaciones de toolbar .title/.subtitle. Todo eso es de 26 y no tiene
    # equivalente en 17/18 que valga la pena mantener por duplicado.
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # 1 = iPhone, 2 = iPad → app adaptativa
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tamio:
    type: application
    platform: iOS
    sources:
      - path: Tamio
    settings:
      base:
        # Bundle id de trabajo. NO es com.tesoreria.app a propósito: esto es un
        # prototipo local. Al decidir si la app nativa hereda la ficha actual
        # de App Store se cambiará aquí (ver conversación de arranque).
        PRODUCT_BUNDLE_IDENTIFIER: church.tamio.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
