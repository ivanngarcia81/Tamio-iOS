name: Tamio
options:
  bundleIdPrefix: church.tamio
  deploymentTarget:
    # iOS 26: la app usa Liquid Glass (glassEffect, GlassEffectContainer, los
    # estilos de botón .glass), el desvanecido de borde de scroll y las
    # colocaciones de toolbar .title/.subtitle. Todo eso es de 26 y no tiene
    # equivalente en 17/18 que valga la pena mantener por duplicado.
    iOS: "26.0"
    # **macOS 26 y no 27, aunque solo esté el SDK 27.** Se compila contra el 27
    # —es el único instalado— y se declara 26 como piso, que es exactamente lo
    # que hace el target de iOS. El motivo no es técnico sino de quién usa esto:
    # macOS 27 acaba de salir y las iglesias actualizan tarde y en Macs viejos.
    # Poner el piso en 27 las deja fuera el primer año entero.
    #
    # Y no se pierde nada: Liquid Glass —lo que obliga a iOS 26 arriba— llegó a
    # macOS en la 26 también, así que el vocabulario visual es el mismo. Si
    # algún día hace falta algo exclusivo de la 27, entra con `if #available` y
    # el piso se queda donde está.
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # **Firma. Las dos líneas siguientes vivían SOLO en el `.pbxproj`.**
    #
    # Se descubrieron comparando los ajustes efectivos del target antes y
    # después de la primera regeneración, y las dos eran una regresión:
    #
    # - `CODE_SIGN_IDENTITY` volvía a `iPhone Developer`, que es el nombre de
    #   antes de Xcode 11 y justo el que el comentario de `CODE_SIGN_STYLE` de
    #   abajo dice que se corrigió. Al no estar declarado aquí, xcodegen ponía
    #   su valor por omisión y deshacía el arreglo.
    # - `DEVELOPMENT_TEAM` desaparecía entero. Sin equipo no se firma: ni
    #   archivo, ni TestFlight, ni aparato de verdad.
    #
    # Van en la base del PROYECTO y no dentro de un target porque valen para
    # los dos: `Apple Development` es el nombre de la identidad en iOS y en
    # macOS, y el equipo es el mismo.
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 4N9XEU7F4P
    TARGETED_DEVICE_FAMILY: "1,2"   # 1 = iPhone, 2 = iPad → app adaptativa
    # **1.0.0: ficha NUEVA, producto que debuta.** Estuvo un rato en 2.0.0,
    # cuando el plan era reemplazar a la app de Tauri en su misma ficha. Se
    # revirtió el 8-sep-2026: "2.0" solo significa algo para quien conoció la
    # 1.x, y esa gente no va a ver esta ficha.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
# **Los paquetes se declaran AQUÍ, y antes no lo estaban.**
#
# Vivían solo dentro del `.pbxproj`, como `XCRemoteSwiftPackageReference`. Con
# este archivo sin la sección `packages`, regenerar el proyecto borraba las dos
# dependencias y la app dejaba de compilar: `import GRDB` e `import Supabase`
# fallan en los 30 archivos que los usan. Era una bomba de relojería que se
# disparaba la primera vez que alguien corriera `xcodegen` en limpio.
#
# Las versiones son LAS MISMAS que tenía el `.pbxproj` —`upToNextMajorVersion`
# desde 2.5.1 y desde 6.29.0—, copiadas literalmente para que regenerar no
# mueva ninguna dependencia. Lo que estaba resuelto sigue resuelto.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.5.1
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 6.29.0

targets:
  Tamio:
    type: application
    platform: iOS
    sources:
      - path: Tamio
    settings:
      base:
        # **Id definitivo. Ficha NUEVA. Decidido con Iván el 17-sep-2026.**
        #
        # Estuvo desde el 8-sep como provisional, a la espera de decidir si
        # esta app heredaba la ficha de `com.tesoreria.app` —la de Tauri del
        # repo `Tamio-app`, publicada el 13 de agosto de 2026 y hoy con la
        # 1.3.5 en TestFlight— y salía como su 2.0. **Ya no: se queda aparte
        # para siempre.**
        #
        # El porqué, que es el mismo que lo tenía aparcado: la publicada es
        # gratis, sin cuenta y 100% local; la nativa exige cuenta y guarda en
        # un servidor. Mandarla como actualización despierta a quien tenga la
        # vieja con una pantalla de acceso que no puede pasar y sus libros
        # detrás —viven en SU aparato, y aquí se lee de Supabase: no migra
        # nada—. No es una versión nueva de esa app: es otra app.
        #
        # **Y una se deshace y la otra no.** Con ficha nueva la vieja sigue
        # funcionando y las iglesias se mudan cuando les toca. Al revés no hay
        # vuelta: una app publicada no cambia de bundle id nunca.
        #
        # Lo que esto obliga a NO hacer: cambiar esta línea. Ya no es un
        # "mientras tanto".
        PRODUCT_BUNDLE_IDENTIFIER: church.tamio.native
        # **Firma, y lo que NO se puede hacer aquí.** El `.pbxproj` decía
        # `iPhone Developer`, que es el nombre de antes de Xcode 11. Hoy la
        # identidad se llama `Apple Development` y es la que va en las DOS
        # configuraciones.
        #
        # Y no, en Release no se pone `Apple Distribution`. Se probó el 17 de
        # septiembre de 2026 y `xcodebuild` lo rechaza de plano:
        #
        #     error: Tamio has conflicting provisioning settings. Tamio is
        #     automatically signed for development, but a conflicting code
        #     signing identity Apple Distribution has been manually specified.
        #
        # Con firma AUTOMÁTICA el archivo se firma de desarrollo a propósito
        # —lleva `get-task-allow` y su lista de aparatos— y quien pone la firma
        # de distribución es el paso de EXPORTAR: `xcodebuild -exportArchive`
        # con `method: app-store-connect`, o "Distribute App" del Organizer.
        # Vuelve a firmar el paquete entero. Fijarlo aquí solo rompe el
        # archivo; no adelanta nada.
        #
        # Firmar de distribución desde el archivo pediría `CODE_SIGN_STYLE:
        # Manual` y nombrar un perfil concreto en el proyecto, que es lo que se
        # hace en un servidor de integración y no lo que hace falta aquí.
        CODE_SIGN_STYLE: Automatic
        # **Repetido aquí aunque ya esté en la base del proyecto, y hace falta.**
        #
        # xcodegen le mete a todo target de aplicación de iOS un
        # `CODE_SIGN_IDENTITY = iPhone Developer` de serie, y ese valor —por ser
        # del target— gana al de la base. Declararlo aquí es lo único que
        # deshace el ajuste por omisión. Comprobado: sin esta línea, el
        # comparador de ajustes efectivos lo delata en cada regeneración.
        CODE_SIGN_IDENTITY: Apple Development
        GENERATE_INFOPLIST_FILE: YES
        # Se MEZCLA con el plist generado. Solo lleva `CFBundleLocalizations`,
        # que no tiene ajuste `INFOPLIST_KEY_` y no hay otra forma de poner.
        INFOPLIST_FILE: Config/Info.plist
        # **Cumplimiento de exportación.** Sin esta clave, App Store Connect
        # pregunta lo mismo en CADA subida.
        #
        # `NO` = "no usa cifrado NO exento". Lo que la app cifra son los
        # respaldos, con AES-GCM de **CryptoKit** (`RespaldoCifrado`), más la
        # protección de datos del propio iOS y HTTPS contra Supabase. Las tres
        # son cifrado del sistema operativo de Apple con algoritmos estándar,
        # que es justo lo que la exención cubre: no hay criptografía propia ni
        # algoritmo inventado en ninguna parte del repo.
        #
        # **Vivía en `Config/Info.plist` y se perdió**: Xcode reescribió ese
        # archivo el 19-sep y se llevó la clave con los comentarios. Aquí no
        # puede pasar —este ajuste SÍ tiene prefijo `INFOPLIST_KEY_`, al
        # contrario que `CFBundleLocalizations`—, y así regenerar el proyecto
        # la vuelve a poner en vez de borrarla.
        #
        # ES UNA DECLARACIÓN LEGAL. Está puesta con ese razonamiento, pero la
        # firma Iván, no yo.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # **Los tres permisos van en INGLÉS aquí**, que es la región de
        # desarrollo del proyecto: son el valor BASE, el que se usa cuando el
        # idioma del aparato no es ninguno de los dos. El español vive en
        # `Tamio/es.lproj/InfoPlist.strings`.
        #
        # Estaban solo en el `.pbxproj` y solo en español, así que un usuario
        # en inglés veía tres diálogos del sistema en español.
        INFOPLIST_KEY_NSCameraUsageDescription: "To photograph the bank receipt when recording a deposit."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "To unlock Tamio with your face instead of typing your password every time."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To attach a photo of the bank receipt to a deposit."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # **El teléfono, solo en vertical.** En apaisado el iPhone grande pasa
        # a clase de tamaño regular y la app se dibuja como en iPad —lista y
        # detalle en dos columnas, la sidebar—, así que girar el teléfono daba
        # una app que no es la del teléfono. El iPad conserva las cuatro: ahí
        # las dos columnas son la pantalla, no un accidente.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GRDB
        product: GRDB

  # **La app de Mac. Comparte el motor, NO las pantallas.**
  #
  # Entran `Models`, `Data`, `ViewModels` y `Support`: 23.000 líneas donde vive
  # el dinero —los repositorios, la sincronización, GRDB, Supabase, los
  # cálculos— y que no saben en qué aparato corren. Esa capa se comparte
  # LITERALMENTE, sin copiar ni un archivo, porque es justo la que no se puede
  # permitir que diverja: un redondeo distinto entre el iPhone y el Mac de la
  # misma iglesia es un libro que no cuadra.
  #
  # **`Views` NO entra**, y es a propósito. Las vistas de iOS son un maestro-
  # detalle de iPad y un `TabView` de iPhone; la maqueta de Mac es otra cosa
  # —barra de menús, tabla con columnas ordenables, inspector, ventana de
  # captura rápida—. Reutilizar `MovimientosView` aquí sería pelearse con el
  # diseño en vez de implementarlo. Las pantallas de Mac viven en `TamioMac/` y
  # se apoyan en los MISMOS ViewModels.
  TamioMac:
    type: application
    platform: macOS
    sources:
      - path: Tamio/Models
      - path: Tamio/Data
      - path: Tamio/ViewModels
      - path: Tamio/Support
        excludes:
          # Rescata el gesto de "volver" de la pila de navegación de UIKit. En
          # Mac no hay ese gesto ni esa pila: el archivo entero sobra.
          - "NavHeader.swift"
      - path: Tamio/Assets.xcassets
      - path: Tamio/en.lproj
      - path: Tamio/es.lproj
      - path: TamioMac
    settings:
      base:
        # **El MISMO id que iOS · CERRADO el 21-sep-2026. No se toca.**
        #
        # Una sola ficha en la tienda con las dos plataformas, y no dos fichas.
        #
        # Lo de "Compra Universal" aquí **no significa dinero**: Tamio es gratis
        # y sin compra integrada, apoyada en 3.1.3(c) y (f) (`docs/APP-STORE.md`),
        # así que no hay nada que comprar en ninguna de las dos. Lo único que
        # cambia de verdad es el número de fichas.
        #
        # **Y por eso se queda.** El proyecto ya está defendiendo un **4.3** por
        # tener dos apps publicadas —la de Tauri y «Tamio Iglesia»—, y el remedio
        # que Apple da para el 4.3 es *una sola app*. Una tercera ficha para el
        # Mac debilitaría justo el encuadre que la ficha y la nota al revisor
        # están cuidando.
        #
        # **Lo que obliga:** la ficha pasará a declarar macOS, así que el Mac no
        # se sube hasta que esté presentable. Tener el target sin subirlo no
        # cuesta nada.
        PRODUCT_BUNDLE_IDENTIFIER: church.tamio.native
        # La app se llama Tamio. `TamioMac` es el nombre del target, no del
        # producto: sin esto el .app sale llamándose "TamioMac".
        PRODUCT_NAME: Tamio
        CODE_SIGN_STYLE: Automatic
        # **Caja de arena, obligatoria en la Mac App Store.**
        #
        # Se declara SOLO en el archivo de derechos y no con el ajuste
        # `ENABLE_APP_SANDBOX`: desde Xcode 16 ese ajuste genera su propio
        # archivo de derechos y entra en conflicto con uno puesto a mano. Una
        # sola fuente, que es el archivo.
        CODE_SIGN_ENTITLEMENTS: Config/TamioMac.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # El mismo plist que iOS: lo único que lleva es `CFBundleLocalizations`,
        # que no tiene ajuste `INFOPLIST_KEY_` y hay que poner a mano.
        INFOPLIST_FILE: Config/Info.plist
        # La misma declaración legal que en iOS, y por el mismo motivo: lo que
        # se cifra son los respaldos, con CryptoKit de Apple. La firma Iván.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # En inglés, que es la región de desarrollo. El español vive en
        # `Tamio/es.lproj/InfoPlist.strings`, que este target también compila.
        #
        # **No va `NSFaceIDUsageDescription`**: en Mac el desbloqueo es Touch ID
        # a través de `LocalAuthentication`, que no pide cadena de uso. La
        # política que usa `BloqueoBiometrico` es `deviceOwnerAuthentication`,
        # así que en un Mac sin Touch ID cae a la contraseña y nadie se queda
        # fuera de sus propios libros.
        INFOPLIST_KEY_NSCameraUsageDescription: "To photograph the bank receipt when recording a deposit."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To attach a photo of the bank receipt to a deposit."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Categoría de la ficha: finanzas, igual que la de iOS.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GRDB
        product: GRDB
