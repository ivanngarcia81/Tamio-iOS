name: Tamio
options:
  bundleIdPrefix: church.tamio
  deploymentTarget:
    # iOS 26: la app usa Liquid Glass (glassEffect, GlassEffectContainer, los
    # estilos de botón .glass), el desvanecido de borde de scroll y las
    # colocaciones de toolbar .title/.subtitle. Todo eso es de 26 y no tiene
    # equivalente en 17/18 que valga la pena mantener por duplicado.
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # 1 = iPhone, 2 = iPad → app adaptativa
    # **1.0.0: ficha NUEVA, producto que debuta.** Estuvo un rato en 2.0.0,
    # cuando el plan era reemplazar a la app de Tauri en su misma ficha. Se
    # revirtió el 8-sep-2026: "2.0" solo significa algo para quien conoció la
    # 1.x, y esa gente no va a ver esta ficha.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tamio:
    type: application
    platform: iOS
    sources:
      - path: Tamio
    settings:
      base:
        # **Id propio, y a propósito, MIENTRAS TANTO.** Decidido con Iván el
        # 8-sep-2026.
        #
        # Ya hay una app publicada: `com.tesoreria.app`, la de Tauri del repo
        # `Tamio-app`, en App Store desde el 13 de agosto de 2026 y hoy en
        # TestFlight con la 1.3.5. Esta app nativa está llamada a REEMPLAZARLA
        # y a salir como la 2.0.
        #
        # **Y ahí está el nudo: una app publicada no puede cambiar de bundle
        # id.** "2.0 de esa misma app" y "id propio" no pueden ser las dos
        # verdad el día de la subida. El día que se suba a esa ficha, esto
        # tiene que decir `com.tesoreria.app` — no hay segunda oportunidad, y
        # equivocarse crea una app distinta para siempre.
        #
        # Se queda aparte por ahora porque la nativa EXIGE cuenta y la
        # publicada salió gratis, sin login y 100% local para pasar la
        # revisión: mandarla como actualización a esos usuarios les rompe la
        # app que tienen. Eso se resuelve antes, no con un ajuste de
        # compilación.
        PRODUCT_BUNDLE_IDENTIFIER: church.tamio.native
        GENERATE_INFOPLIST_FILE: YES
        # Se MEZCLA con el plist generado. Solo lleva `CFBundleLocalizations`,
        # que no tiene ajuste `INFOPLIST_KEY_` y no hay otra forma de poner.
        INFOPLIST_FILE: Config/Info.plist
        # **Los tres permisos van en INGLÉS aquí**, que es la región de
        # desarrollo del proyecto: son el valor BASE, el que se usa cuando el
        # idioma del aparato no es ninguno de los dos. El español vive en
        # `Tamio/es.lproj/InfoPlist.strings`.
        #
        # Estaban solo en el `.pbxproj` y solo en español, así que un usuario
        # en inglés veía tres diálogos del sistema en español.
        INFOPLIST_KEY_NSCameraUsageDescription: "To photograph the bank receipt when recording a deposit."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "To unlock Tamio with your face instead of typing your password every time."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To attach a photo of the bank receipt to a deposit."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # **El teléfono, solo en vertical.** En apaisado el iPhone grande pasa
        # a clase de tamaño regular y la app se dibuja como en iPad —lista y
        # detalle en dos columnas, la sidebar—, así que girar el teléfono daba
        # una app que no es la del teléfono. El iPad conserva las cuatro: ahí
        # las dos columnas son la pantalla, no un accidente.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
